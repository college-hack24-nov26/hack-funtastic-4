<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Log in to your MythoVerse student account.">
    <title>Login | MythoVerse</title>
    <link rel="stylesheet" href="/assets/css/global.css">
    <script src="/assets/js/auth-client.js" defer></script>
    <script src="/assets/js/main.js" defer></script>
    <script src="/assets/js/login.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div data-component="header"></div>

    <main id="main-content" class="page-main auth-page">
      <section class="auth-card auth-card-compact card" aria-labelledby="login-title">
        <div class="auth-heading">
          <p class="eyebrow">Welcome back</p>
          <h1 id="login-title">Log in to MythoVerse</h1>
          <p class="muted">Use the email and password for your student account.</p>
        </div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="form-field">
            <label class="form-label" for="login-email">Email</label>
            <input
              class="form-control"
              id="login-email"
              name="email"
              type="email"
              autocomplete="username"
              inputmode="email"
              maxlength="254"
              required
              aria-describedby="login-email-error"
            >
            <p class="form-error" id="login-email-error" hidden></p>
          </div>

          <div class="form-field">
            <label class="form-label" for="login-password">Password</label>
            <div class="password-control">
              <input
                class="form-control"
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                aria-describedby="login-password-error"
              >
              <button
                class="password-toggle"
                type="button"
                data-toggle-password
                aria-controls="login-password"
                aria-pressed="false"
              >Show</button>
            </div>
            <p class="form-error" id="login-password-error" hidden></p>
          </div>

          <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
          <button class="button button-primary auth-submit" type="submit">Log in</button>
        </form>

        <p class="auth-alternate">
          New to MythoVerse? <a href="/register.html">Create a student account</a>
        </p>
      </section>
    </main>

    <div data-component="footer"></div>
  </body>
</html>
